[project]
name = "clinicore"
version = "0.1.0"
description = "Generic clinic / practice management and digital prescription system."
requires-python = ">=3.12"
license = "MIT"

# Runtime dependencies are added with the uv/Docker work later in Phase 0.

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade -- UP010 removes `from __future__ import annotations`
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "Q",    # flake8-quotes
    "SIM",  # flake8-simplify
    "RUF",
]

[tool.ruff.lint.flake8-quotes]
# Matches [tool.ruff.format] below; keeps the linter and formatter from fighting.
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
# Django's Meta options, ModelAdmin options, and form Meta.fields are
# declarative class-level lists by design; RUF012 wants ClassVar on all of them.
# The forms glob is deliberately wider than one filename: the case record is
# big enough to keep out of patients/forms.py, and a form Meta is a form Meta
# wherever it is declared.
"*/models.py" = ["RUF012"]
"*/admin.py" = ["RUF012"]
"*/*forms.py" = ["RUF012"]
"*/views.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "catalog",
    "clinical",
    "config",
    "core",
    "organizations",
    "patients",
]

[tool.ruff.format]
# Without this, `ruff format` rewrites every single-quoted string on the first
# pre-commit run. Docstrings stay on `"""` regardless -- the formatter always
# normalizes those to double quotes.
quote-style = "single"
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]