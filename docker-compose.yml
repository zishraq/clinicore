# Local development stack: Django + Postgres, runserver, a bind mount, and a
# throwaway password. Production is docker-compose.prod.yml — a separate file,
# not an override, so none of those defaults can leak into a deployment that
# forgot a `-f` flag.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicore
      POSTGRES_USER: clinicore
      POSTGRES_PASSWORD: clinicore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5433 on the host so this never collides with a locally installed
      # Postgres; inside the compose network `web` still talks to db:5432.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinicore -d clinicore']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # migrate on boot is a development convenience; production runs migrations
    # as an explicit, reviewable step.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,[::1],web'
      POSTGRES_DB: clinicore
      POSTGRES_USER: clinicore
      POSTGRES_PASSWORD: clinicore
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
