{% extends 'base.html' %}

{% block title %}No organization{% endblock %}

{% block anon_content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card-surface rounded-2xl p-8 max-w-md text-center">
    <h1 class="text-xl font-semibold">No active organization</h1>
    <p class="text-sm text-muted mt-2">
      Your account is not a member of any active clinic yet. Ask the owner to add
      you, then sign in again.
    </p>
    <form method="post" action="{% url 'accounts:logout' %}" class="mt-6">
      {% csrf_token %}
      <button type="submit" class="btn btn-brand">Log out</button>
    </form>
  </div>
</div>
{% endblock %}
