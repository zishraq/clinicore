{% comment %}
One labelled field on the patient modal. Same fields as the full page, tighter
labels — the modal opens over another screen's half-written form.
{% endcomment %}
<div class="{% if field.name == 'address' %}sm:col-span-2{% endif %}">
  <label class="label py-1" for="{{ field.id_for_label }}">
    <span class="label-text text-xs">{{ field.label }}</span>
  </label>
  {{ field }}
  {% for error in field.errors %}
    <p class="text-sm text-[var(--cc-danger)] mt-1">{{ error }}</p>
  {% endfor %}
</div>
